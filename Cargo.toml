[package]
name = "tubeforge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Local-first YouTube SEO/GEO growth engine — RSS/oEmbed/API ingest, BM25 scoring, analytics, thumbnail generation. CLI-first, agent-ready."
keywords = ["youtube", "seo", "analytics", "cli", "search"]
categories = ["command-line-utilities", "multimedia"]
repository = "https://github.com/<owner>/tubeforge"

[dependencies]
askama = "0.14"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
chromiumoxide = { version = "0.9.1", features = ["fetcher"] }
chromiumoxide_fetcher = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.5", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3"
quick-xml = "0.41.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "=0.26.1"
thiserror = "2.0.19"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
turso = "=0.7.2"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled"] }
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
