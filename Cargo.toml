[package]
name = "tubeforge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Local-first YouTube SEO/GEO growth engine — RSS/oEmbed/API ingest, BM25 scoring, analytics, thumbnail generation. CLI-first, agent-ready."
keywords = ["youtube", "seo", "analytics", "cli", "search"]
categories = ["command-line-utilities", "multimedia"]
repository = "https://github.com/<owner>/tubeforge"

[dependencies]
askama = "0.14"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query", "json", "macros", "ws"] }
chromiumoxide = { version = "0.9.1", features = ["fetcher"] }
chromiumoxide_fetcher = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.5", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3"
http = "1.1.0"
http-body = "1.0.0"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "http1", "tokio"] }
mime_guess = "2.0.5"
quick-xml = "0.41.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "process", "fs"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
turso = "=0.7.2"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

[dev-dependencies]
proptest = "1.6.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
