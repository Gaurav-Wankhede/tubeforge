[package]
name = "tubeforge"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Local-first YouTube SEO/GEO growth engine — RSS/oEmbed/API ingest, BM25 scoring, analytics, thumbnail generation. CLI-first, agent-ready."
keywords = ["youtube", "seo", "analytics", "cli", "search"]
categories = ["command-line-utilities", "multimedia"]
repository = "https://github.com/Gaurav-Wankhede/tubeforge"

[dependencies]
askama = "0.14"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.5", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3"
http = "1.1.0"
http-body = "1.0.0"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "http1", "tokio"] }
libc = "0.2"
mime_guess = "2.0.5"
quick-xml = "0.41.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "process", "fs", "io-std", "io-util"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

[dev-dependencies]
proptest = "1.6.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"
non_ascii_idents = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
non_snake_case = "allow"
unreachable_patterns = "allow"

[lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "warn"
needless_collect = "deny"
needless_borrow = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
unnecessary_map_or = "warn"
large_enum_variant = "deny"
unnecessary_wraps = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
let_underscore_lock = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
suboptimal_flops = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
