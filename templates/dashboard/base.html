<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/sse.js" defer></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --line: #2a2f3a;
      --fg: #e6e8ee; --dim: #9aa3b2; --acc: #4f8cff; --ok: #3fbf6f; --warn: #e0a63f; --bad: #e05a5a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; min-height: 100vh; }
    .skip-link { position: absolute; left: -9999px; top: 0; z-index: 100;
                 background: var(--acc); color: #fff; padding: 6px 14px;
                 border-radius: 0 0 8px 0; text-decoration: none; }
    .skip-link:focus { left: 0; }
    .sidebar { width: 210px; flex-shrink: 0; background: var(--panel);
               border-right: 1px solid var(--line); display: flex;
               flex-direction: column; padding: 14px 0 20px;
               position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .sidebar .brand { color: var(--fg); font-weight: 700; font-size: 15px;
                      padding: 0 18px 14px; }
    .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
    .sidebar nav a { display: flex; align-items: center; gap: 10px;
                     color: var(--dim); text-decoration: none; padding: 8px 18px;
                     font-weight: 500; border-left: 3px solid transparent; }
    .sidebar nav a:hover { color: var(--fg); background: var(--panel2); }
    .sidebar nav a.active { color: var(--fg); background: var(--panel2);
                            border-left-color: var(--acc); }
    .sidebar .ico { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }
    .page { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { display: none; align-items: center; gap: 12px; padding: 10px 14px;
              background: var(--panel); border-bottom: 1px solid var(--line); }
    .topbar .menu-toggle { background: none; border: 1px solid var(--line);
                           color: var(--fg); font-size: 16px; line-height: 1;
                           padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .topbar .menu-toggle:hover { border-color: var(--acc); }
    main { padding: 16px 20px; max-width: 1100px; width: 100%; margin: 0 auto; }
    h1 { font-size: 20px; margin: 4px 0 14px; }
    h2 { font-size: 15px; margin: 20px 0 8px; color: var(--fg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .card .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .card .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
    .card.wide { grid-column: span 2; }
    table { width: 100%; border-collapse: collapse; background: var(--panel);
            border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
    th { background: var(--panel2); color: var(--dim); font-size: 12px;
         text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    tr.row { cursor: pointer; }
    tr.row:hover { background: var(--panel2); }
    tr.row:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
    .muted { color: var(--dim); }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px;
             font-size: 12px; font-weight: 600; border: 1px solid var(--line); }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .draft { background: #2a2f3a; } .saved { background: #173a26; color: var(--ok); border-color: var(--ok); }
    .discarded { background: #3a1c1c; color: var(--bad); border-color: var(--bad); }
    .unread { background: #2a3348; color: var(--acc); border-color: var(--acc); }
    .up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--dim); }
    button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
             border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
    button:hover { border-color: var(--acc); }
    button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
    input[type=search] { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
                          border-radius: 6px; padding: 6px 10px; }
    .flex { display: flex; gap: 10px; align-items: center; }
    .detail { background: var(--panel2); }
    .detail table { background: transparent; border: none; }
    .detail th { background: transparent; }
    .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .cols2 { grid-template-columns: 1fr; } }
    svg text.cl { fill: var(--dim); font-size: 12px; }
    svg text.cv { fill: var(--fg); font-size: 12px; }
    svg text.ca { fill: var(--dim); font-size: 11px; }
    svg rect.bar { fill: var(--acc); }
    svg polyline.line { stroke: var(--acc); stroke-width: 1.5; }
    svg circle.dot { fill: var(--acc); }
    svg text.spark-label { fill: var(--dim); font-size: 10px; }
    footer { color: var(--dim); font-size: 12px; padding: 20px 0 30px; text-align: center; }
    .flash { animation: flash 1s; }
    @keyframes flash { from { background: #23344f; } to { background: transparent; } }
    @media (prefers-reduced-motion: no-preference) { .flash { animation: flash 1s; } }
    @media (max-width: 860px) {
      .sidebar { position: fixed; left: -230px; top: 0; bottom: 0; z-index: 20;
                 height: 100vh; transition: left .2s ease; }
      .sidebar.open { left: 0; box-shadow: 0 0 24px rgba(0,0,0,.5); }
      .topbar { display: flex; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar" id="sidebar">
    <div class="brand">TubeForge</div>
    <nav aria-label="Main navigation">
      <a href="/" {% if active == "home" %}class="active" aria-current="page"{% endif %}><span class="ico">▦</span> Dashboard</a>
      <a href="/scores" {% if active == "scores" %}class="active" aria-current="page"{% endif %}><span class="ico">◎</span> Scores</a>
      <a href="/ideas" {% if active == "ideas" %}class="active" aria-current="page"{% endif %}><span class="ico">✦</span> Ideas</a>
      <a href="/keywords" {% if active == "keywords" %}class="active" aria-current="page"{% endif %}><span class="ico">⌕</span> Keywords</a>
      <a href="/alerts" {% if active == "alerts" %}class="active" aria-current="page"{% endif %}><span class="ico">❢</span> Alerts</a>
      <a href="/scorecard" {% if active == "scorecard" %}class="active" aria-current="page"{% endif %}><span class="ico">▤</span> Scorecard</a>
      <a href="/health" {% if active == "health" %}class="active" aria-current="page"{% endif %}><span class="ico">✚</span> Health</a>
    </nav>
  </aside>
  <div class="page">
    <header class="topbar">
      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false"
              onclick="var s=document.getElementById('sidebar');s.classList.toggle('open');this.setAttribute('aria-expanded',s.classList.contains('open'))">☰</button>
      <span>{{ title }}</span>
    </header>
    <main id="main">
      {{ content|safe }}
    </main>
    <footer>TubeForge — local-first dashboard (loopback only) · data never leaves this machine</footer>
  </div>
</body>
</html>
