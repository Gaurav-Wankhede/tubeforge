<!doctype html>
<!--
  TubeForge default thumbnail template — 1280x720.
  Optimized for Cognitive Load & Tufte Data-Ink Ratio (2026 Research-Backed):
  - Pure Black #000000 background (zero gradients, zero glow blobs, zero decorative cards).
  - Single focal concept on left/center-left, strictly two-line high-contrast typography.
  - Passes the 120px mobile squint test.

  Placeholder convention (replaced at render time by src/thumbnail.rs):
    {{TITLE}}            video title (high-contrast 2-line headline)
    {{CHANNEL}}          channel display name (empty string hides)
    {{CHANNEL_INITIAL}}  first letter of channel (avatar badge, empty string hides)
    {{DURATION}}         "MM:SS" / "H:MM:SS" (empty string hides)
    {{CATEGORY}}         category name (empty string hides)
    {{VIDEO_ID}}         video id (empty string hides)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<link rel="stylesheet" href="tailwind.css">
<title>{{TITLE}}</title>
<style>
  body {
    background-color: #000000;
    margin: 0;
    padding: 0;
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
</style>
</head>
<body class="relative h-[720px] w-[1280px] overflow-hidden bg-black text-white antialiased">
  <!-- Minimal Top Metadata Bar (Left: Category, Right: TechVerse / TubeForge Brand) -->
  <header class="absolute inset-x-12 top-10 flex items-center justify-between">
    <span class="empty:hidden text-lg font-bold uppercase tracking-[0.25em] text-cyan-400">{{CATEGORY}}</span>
    <div class="flex items-center gap-3">
      <span class="text-base font-bold uppercase tracking-[0.35em] text-white/40">TECHVERSE</span>
      <span class="empty:hidden text-xs font-mono tracking-widest text-white/20">{{VIDEO_ID}}</span>
    </div>
  </header>

  <!-- Main Hero Stage: Left Hero Icon / Focal Watermark + Bold 2-Line Headline -->
  <main class="absolute inset-x-12 inset-y-24 flex items-center justify-start gap-12">
    <!-- Left Hero Focal Point -->
    <div class="flex h-64 w-64 shrink-0 items-center justify-center">
      <svg class="h-56 w-56 text-cyan-400 opacity-90" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2" />
        <polyline points="2 17 12 22 22 17" />
        <polyline points="2 12 12 17 22 12" />
      </svg>
    </div>

    <!-- Right/Center Two-Line Headline (Tufte Data-Ink: Max contrast, 0 clutter) -->
    <div class="flex flex-1 flex-col justify-center">
      <h1 class="line-clamp-2 text-[72px] font-black uppercase leading-[1.02] tracking-tight text-white drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)]">
        {{TITLE}}
      </h1>
    </div>
  </main>

  <!-- Minimal Footer: Channel Name & Duration -->
  <footer class="absolute inset-x-12 bottom-10 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="empty:hidden grid h-8 w-8 place-items-center rounded bg-white/10 text-xs font-bold text-white/80">{{CHANNEL_INITIAL}}</span>
      <span class="empty:hidden text-lg font-medium tracking-wide text-white/60">{{CHANNEL}}</span>
    </div>
    <span class="empty:hidden font-mono text-sm font-semibold tracking-wider text-white/40">{{DURATION}}</span>
  </footer>
</body>
</html>
